services:
  identity-service:
    container_name: identity-dev
    environment:
      SPRING_PROFILES_ACTIVE: dev
    networks:
      - default
      - edge
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.identity.rule=Host(`identity.tonino.localhost`)"
      - "traefik.http.routers.identity.entrypoints=web"
      - "traefik.http.services.identity.loadbalancer.server.port=8082"
      - "traefik.docker.network=tonino-edge"

  postgres:
    container_name: pg-dev
    ports:
      - "5433:5432"

  keycloak:
    container_name: kc-dev
    command: start-dev --import-realm
    networks:
      - default
      - edge
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.identity-keycloak.rule=Host(`auth.tonino.localhost`)"
      - "traefik.http.routers.identity-keycloak.entrypoints=web"
      - "traefik.http.services.identity-keycloak.loadbalancer.server.port=8080"
      - "traefik.docker.network=tonino-edge"

networks:
  edge:
    external: true
    name: tonino-edge