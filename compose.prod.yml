# HTTPS terminates at a reverse proxy on the Docker host.
services:
  identity-service:
    container_name: identity-prod
    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: prod

    networks:
      - default
      - edge

    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.identity.rule=Host(`${IDENTITY_HOST}`)"
      - "traefik.http.routers.identity.entrypoints=websecure"
      - "traefik.http.routers.identity.tls=true"
      - "traefik.http.routers.identity.tls.certresolver=letsencrypt"

      - "traefik.http.services.identity.loadbalancer.server.port=8082"
      - "traefik.docker.network=tonino-edge"

  postgres:
    restart: unless-stopped

  keycloak:
    restart: unless-stopped
    command: start --import-realm
    environment:
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "true"
      KC_PROXY_HEADERS: xforwarded
    networks:
      - default
      - edge
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.identity-keycloak.rule=Host(`${KEYCLOAK_HOST}`)"
      - "traefik.http.routers.identity-keycloak.entrypoints=websecure"
      - "traefik.http.routers.identity-keycloak.tls=true"
      - "traefik.http.routers.identity-keycloak.tls.certresolver=letsencrypt"
      - "traefik.http.services.identity-keycloak.loadbalancer.server.port=8080"
      - "traefik.docker.network=tonino-edge"

networks:
  edge:
    external: true
    name: tonino-edge